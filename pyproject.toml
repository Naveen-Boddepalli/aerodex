[project]
name = "aerodex"
version = "0.1.0"
description = "Real-time airfare price index for India (SIH 2026, PS SIH26056, MoSPI)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "psycopg[binary]>=3.2",
    "pandas>=2.2",
    "numpy>=1.26",
    "statsmodels>=0.14",
    "structlog>=24.1",
    "tenacity>=8.3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "boto3>=1.34",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
render = ["playwright>=1.44"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
aerodex = "aerodex.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aerodex"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["canary: live structural checks against real sources (network)"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
