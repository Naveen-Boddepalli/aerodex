# Local development database. Production runs Postgres 16 + TimescaleDB
# directly on the Oracle A1 VM (plan §5.3), not in Docker.
services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: aerodex-db
    environment:
      POSTGRES_USER: aerodex
      POSTGRES_PASSWORD: aerodex
      POSTGRES_DB: aerodex
    ports: ["5433:5432"]
    volumes:
      - aerodex-pgdata:/var/lib/postgresql/data
      - ./aerodex/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aerodex -d aerodex"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  aerodex-pgdata:
