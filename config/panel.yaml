# AeroDex panel definition — plan §3 (sizing) and M1 (>= 60 O-D pairs).
# 60 routes x 7 horizons x 3 slots => 1,260 stratum-slots/day nominal,
# ~1,155 after overlap suppression (see collection.overlap_suppression).
version: 1
weights_vintage: "dgca-2025-city-pairs-r2"   # written by scripts/parse_dgca_weights.py

cabins: [economy]

# Days between collection date and departure date.
horizons_days: [1, 3, 7, 14, 21, 30, 60]

# Fixed IST collection slots. Methodology defines a slot as a +/-15 min window
# (plan §5.1) so late collection degrades gracefully instead of voiding a stratum.
slots:
  - {id: morning,   local_time: "07:00", tz: "Asia/Kolkata"}
  - {id: afternoon, local_time: "13:00", tz: "Asia/Kolkata"}
  - {id: evening,   local_time: "20:00", tz: "Asia/Kolkata"}

collection:
  slot_tolerance_minutes: 15
  overlap_suppression: true    # skip a (route,horizon,slot) already collected < 4h ago
  min_seconds_between_requests_per_host: 20   # plan §7 — enforced in compliance.py

# weight = share of 2025 DGCA domestic passengers on that O-D city pair,
# normalised over the panel so the weights sum to 1. Generated by
# `scripts/parse_dgca_weights.py`; do not hand-edit — regenerate and bump
# MAPPING_REVISION so the vintage still identifies the numbers.
#
# Directional strata (DEL-BOM and BOM-DEL are separate rows) are each weighted
# by their city pair's *total* traffic, then renormalised. DGCA publishes the
# directional split and this discards it; the effect on relative weights is
# ~0.3% because Indian trunk traffic is near-symmetric. See methodology.yaml.
#
# Goa is a city-level roll-up: DGCA reports one "GOA" city covering both Dabolim
# (GOI) and Manohar/Mopa (GOX); the panel samples GOX and receives all of it.
routes:
  - {origin: DEL, destination: BOM, weight: 0.06116053}
  - {origin: DEL, destination: BLR, weight: 0.04467567}
  - {origin: BOM, destination: BLR, weight: 0.03624810}
